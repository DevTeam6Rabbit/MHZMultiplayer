name: Build installer exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe
        run: dotnet publish installer/Installer.csproj -c Release -o out

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHZMultiplayerInstaller
          path: out/MHZMultiplayerInstaller.exe

      # when triggered by a tag, attach the exe to that release
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/MHZMultiplayerInstaller.exe
